name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --no-progress
          $wixPath = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3.*\bin" | Select-Object -First 1).FullName
          echo "$wixPath" >> $env:GITHUB_PATH

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Build Windows Binaries
        run: cargo build --release

      - name: Build MSI Installer
        run: cargo wix --nocapture

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-windows-msi
          path: target/wix/*.msi

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-windows-exe
          path: |
            target/release/edge-agent.exe
            target/release/edge-agent-tray.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wix/*.msi
            target/release/edge-agent.exe
            target/release/edge-agent-tray.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
