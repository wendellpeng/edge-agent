[package]
name = "edge-agent"
version = "0.2.0"
description = "Edge data collection agent: ONVIF camera discovery, snapshot, LLM analysis, HTTP push"
edition = "2021"
authors = ["Wendell <wendellpeng@gmail.com>"]

[package.metadata.wix]
eula = false

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.7"
rust-embed = { version = "8", features = ["actix-web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
keyring = { version = "3", features = ["sync-secret-service"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-cron-scheduler = "0.13"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
oxvif = "0.16"
tokio = { version = "1", features = ["full"] }
dirs = "5"
local-ip-address = "0.6"

# Windows tray app (only compiled on Windows)
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
tao = "0.30"

[[bin]]
name = "edge-agent"
path = "src/main.rs"

[[bin]]
name = "edge-agent-tray"
path = "src/bin/tray.rs"
